{
  "name": "Postmerge metadata proposal",
  "on": {
    "workflow_run": {
      "workflows": [
        "Novel continuity checks"
      ],
      "types": [
        "completed"
      ],
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "pull-requests": "read",
    "actions": "read"
  },
  "jobs": {
    "proposal": {
      "if": "${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Verify merged metadata without repository checkout",
          "id": "verify",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "EXPECTED_REPOSITORY": "${{ github.repository }}",
            "EXPECTED_WORKFLOW_SHA": "${{ github.workflow_sha }}",
            "PROPOSAL_OUTPUT": "${{ runner.temp }}/postmerge-proposal/proposal.json"
          },
          "shell": "bash",
          "run": "python3 -I -S - <<'PY'\n\"\"\"Metadata-only proposal from a verified main-branch continuity completion.\n\nCanonical runtime is inline in the default-branch workflow. No repository\ncheckout, source imports, dependencies, upstream artifacts or models are used.\n\"\"\"\nimport hashlib\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport re\nimport sys\nimport urllib.error\nimport urllib.request\nfrom datetime import datetime\n\nMAX_EVENT_BYTES = 8 * 1024 * 1024\nMAX_RESPONSE_BYTES = 2 * 1024 * 1024\nWORKFLOW_NAME = 'Novel continuity checks'\nWORKFLOW_PATH = '.github/workflows/continuity.yml'\nPROPOSAL_PATH = '.github/workflows/postmerge-proposal.yml'\nBRANCH = 'main'\nSHA = re.compile(r'[0-9a-fA-F]{40}\\Z')\nENDPOINT = re.compile(\n    r'repos/[a-z0-9-]+/[a-z0-9_.-]+/(?:actions/workflows/continuity\\.yml'\n    r'|actions/runs/[1-9][0-9]*|git/ref/heads/main|git/commits/[a-f0-9]{40}'\n    r'|commits/[a-f0-9]{40}/pulls\\?per_page=100|pulls/[1-9][0-9]*)\\Z')\n\n\nclass VerificationError(ValueError):\n    pass\n\n\ndef require(condition, message):\n    if not condition:\n        raise VerificationError(message)\n\n\ndef obj(value):\n    require(isinstance(value, dict), 'Required metadata object is absent')\n    return value\n\n\ndef positive(value):\n    require(type(value) is int and 0 < value <= 2**63 - 1, 'Invalid metadata identifier')\n    return value\n\n\ndef sha(value):\n    require(isinstance(value, str) and SHA.fullmatch(value), 'Invalid commit identity')\n    return value.lower()\n\n\ndef repository(value):\n    require(isinstance(value, str) and value.count('/') == 1, 'Invalid repository identity')\n    owner, name = value.split('/')\n    require(re.fullmatch(r'[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?', owner)\n            and re.fullmatch(r'[A-Za-z0-9_.-]{1,100}', name)\n            and name not in ('.', '..'), 'Invalid repository identity')\n    return value.lower()\n\n\ndef parse_json(raw):\n    require(isinstance(raw, bytes) and len(raw) <= MAX_EVENT_BYTES, 'JSON input exceeds limit')\n\n    def pairs(values):\n        result = {}\n        for key, value in values:\n            require(key not in result, 'Duplicate metadata key')\n            result[key] = value\n        return result\n\n    def constant(_):\n        raise VerificationError('Non-finite metadata value')\n\n    def finite(value):\n        number = float(value)\n        require(math.isfinite(number), 'Non-finite metadata value')\n        return number\n\n    try:\n        return json.loads(raw.decode('utf-8'), object_pairs_hook=pairs,\n                          parse_constant=constant, parse_float=finite)\n    except (UnicodeError, ValueError, RecursionError):\n        raise VerificationError('Invalid JSON metadata') from None\n\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, *args, **kwargs):\n        raise VerificationError('GitHub redirect refused')\n\n\nclass GitHubAPI:\n    def __init__(self, token):\n        require(isinstance(token, str) and token.strip() and len(token) <= 4096\n                and '\\r' not in token and '\\n' not in token, 'GitHub token unavailable')\n        self.token = token\n        self.opener = urllib.request.build_opener(NoRedirect(), urllib.request.ProxyHandler({}))\n\n    def get_json(self, path):\n        require(isinstance(path, str) and ENDPOINT.fullmatch(path), 'Endpoint outside read-only allowlist')\n        try:\n            request = urllib.request.Request('https://api.github.com/' + path, method='GET', headers={\n                'Authorization': 'Bearer ' + self.token, 'Accept': 'application/vnd.github+json',\n                'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'AI-Novel-Studio-postmerge-proposal'})\n            with self.opener.open(request, timeout=20) as response:\n                require(response.status == 200, 'GitHub metadata read failed')\n                raw = response.read(MAX_RESPONSE_BYTES + 1)\n            require(len(raw) <= MAX_RESPONSE_BYTES, 'GitHub metadata response exceeds limit')\n            return parse_json(raw)\n        except Exception:\n            # A transport failure must never expose response data or headers.\n            raise VerificationError('GitHub metadata unavailable or invalid') from None\n\n\ndef workflow_view(value):\n    value = obj(value)\n    require(value.get('name') == WORKFLOW_NAME and value.get('path') == WORKFLOW_PATH\n            and value.get('state') == 'active', 'Continuity workflow identity mismatch')\n    return {'id': positive(value.get('id')), 'path': WORKFLOW_PATH, 'name': WORKFLOW_NAME}\n\n\ndef run_view(value, expected_repository):\n    value = obj(value)\n    require(repository(obj(value.get('repository')).get('full_name')) == expected_repository\n            and repository(obj(value.get('head_repository')).get('full_name')) == expected_repository,\n            'Run repository mismatch')\n    require(value.get('event') == 'push' and value.get('head_branch') == BRANCH\n            and value.get('status') == 'completed' and value.get('conclusion') == 'success',\n            'Run is not an eligible successful main push')\n    return {'id': positive(value.get('id')), 'run_attempt': positive(value.get('run_attempt')),\n            'workflow_id': positive(value.get('workflow_id')), 'head_commit': sha(value.get('head_sha')),\n            'branch': BRANCH, 'event': 'push', 'conclusion': 'success'}\n\n\ndef ref_view(value):\n    value = obj(value)\n    target = obj(value.get('object'))\n    require(value.get('ref') == 'refs/heads/main' and target.get('type') == 'commit',\n            'Main branch identity mismatch')\n    return sha(target.get('sha'))\n\n\ndef commit_view(value, expected_merge):\n    value = obj(value)\n    require(sha(value.get('sha')) == expected_merge, 'Merge Git object mismatch')\n    parents = value.get('parents')\n    require(isinstance(parents, list) and len(parents) in (1, 2),\n            'Unsupported merge ancestry')\n    parents = [sha(obj(parent).get('sha')) for parent in parents]\n    require(len(set(parents)) == len(parents) and expected_merge not in parents,\n            'Malformed merge ancestry')\n    return {'sha': expected_merge, 'tree': sha(obj(value.get('tree')).get('sha')),\n            'parents': parents}\n\n\ndef associated_pr(value, expected_repository, expected_merge):\n    require(isinstance(value, list) and len(value) < 100, 'PR association is absent, ambiguous or truncated')\n    candidates = []\n    for item in value:\n        item = obj(item)\n        number = positive(item.get('number'))\n        base = obj(item.get('base'))\n        target = repository(obj(base.get('repo')).get('full_name'))\n        if (item.get('merge_commit_sha') == expected_merge and target == expected_repository\n                and base.get('ref') == BRANCH):\n            candidates.append(number)\n    require(len(candidates) == 1, 'Exactly one matching merged PR association is required')\n    return candidates[0]\n\n\ndef pr_view(value, expected_repository, number, expected_merge):\n    value = obj(value)\n    base = obj(value.get('base'))\n    require(positive(value.get('number')) == number\n            and repository(obj(base.get('repo')).get('full_name')) == expected_repository\n            and base.get('ref') == BRANCH, 'PR target identity mismatch')\n    require(value.get('merged') is True and value.get('state') == 'closed'\n            and sha(value.get('merge_commit_sha')) == expected_merge, 'PR is not the expected merged PR')\n    merged_at = value.get('merged_at')\n    require(isinstance(merged_at, str) and re.fullmatch(r'\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\dZ', merged_at),\n            'Merged timestamp is absent')\n    try:\n        datetime.strptime(merged_at, '%Y-%m-%dT%H:%M:%SZ')\n    except ValueError:\n        raise VerificationError('Merged timestamp is invalid') from None\n    return {'number': number, 'head_commit': sha(obj(value.get('head')).get('sha')),\n            'merge_commit': expected_merge, 'base_commit': sha(base.get('sha')), 'merged_at': merged_at}\n\n\ndef build_proposal(event, expected_repository, workflow_sha, get_json):\n    expected_repository, workflow_sha = repository(expected_repository), sha(workflow_sha)\n    event = obj(event)\n    require(event.get('action') == 'completed', 'Event is not a workflow completion')\n    repo = obj(event.get('repository'))\n    require(repository(repo.get('full_name')) == expected_repository\n            and repo.get('default_branch') == BRANCH, 'Event repository or default branch mismatch')\n    event_run = run_view(event.get('workflow_run'), expected_repository)\n    prefix = 'repos/' + expected_repository + '/'\n    workflow_path = prefix + 'actions/workflows/continuity.yml'\n    run_path = prefix + 'actions/runs/' + str(event_run['id'])\n    ref_path = prefix + 'git/ref/heads/main'\n    merge = event_run['head_commit']\n    association_path = prefix + 'commits/' + merge + '/pulls?per_page=100'\n\n    workflow = workflow_view(get_json(workflow_path))\n    require(event_run['workflow_id'] == workflow['id'], 'Event workflow ID mismatch')\n    observed_run = run_view(get_json(run_path), expected_repository)\n    require(observed_run == event_run, 'Stale or inconsistent workflow run')\n    require(ref_view(get_json(ref_path)) == merge, 'Event is no longer the current main head')\n    commit = commit_view(get_json(prefix + 'git/commits/' + merge), merge)\n    number = associated_pr(get_json(association_path), expected_repository, merge)\n    pr_path = prefix + 'pulls/' + str(number)\n    pr = pr_view(get_json(pr_path), expected_repository, number, merge)\n    require(pr['base_commit'] == commit['parents'][0] and pr['base_commit'] != merge,\n            'PR base is not the verified premerge first parent')\n    if len(commit['parents']) == 2:\n        require(commit['parents'][1] == pr['head_commit'], 'Merge parent does not match PR head')\n\n    require(workflow_view(get_json(workflow_path)) == workflow, 'Workflow identity changed')\n    require(run_view(get_json(run_path), expected_repository) == observed_run, 'Workflow run changed or reran')\n    require(associated_pr(get_json(association_path), expected_repository, merge) == number,\n            'PR association changed')\n    require(pr_view(get_json(pr_path), expected_repository, number, merge) == pr, 'PR metadata changed')\n    require(ref_view(get_json(ref_path)) == merge, 'Main advanced while observing metadata')\n    try:\n        digest = hashlib.sha256(json.dumps(event, sort_keys=True, separators=(',', ':'),\n                                          ensure_ascii=True, allow_nan=False).encode('utf-8')).hexdigest()\n    except (ValueError, TypeError, RecursionError):\n        raise VerificationError('Event cannot be fingerprinted') from None\n    return {'schema_version': 1, 'kind': 'POSTMERGE_METADATA_PROPOSAL', 'status': 'PROPOSED',\n            'human_editorial_approval': 'UNVERIFIED', 'canon_change_authorized': False,\n            'ledger_apply_authorized': False, 'source_scope': 'MERGED_METADATA_ONLY_NO_RECAP_ASSEMBLY',\n            'source': {'repository': expected_repository, 'pr_number': number,\n                       'head_commit': pr['head_commit'], 'merge_commit': merge,\n                       'base_commit': pr['base_commit'], 'merge_tree': commit['tree'],\n                       'merged_at': pr['merged_at']},\n            'upstream_run': observed_run,\n            'workflow_definition': {'commit': workflow_sha,\n                'trust_basis': 'INSTALLED_DEFAULT_BRANCH_WORKFLOW_ONLY_NO_REPOSITORY_SOURCE_EXECUTED'},\n            'event_sha256': digest, 'event_digest_basis': 'CANONICAL_JSON_SORTED_KEYS',\n            'next_step': 'Authorized editor must verify story scope, source evidence and editorial decision before proposing any canon or ledger update.'}\n\n\ndef emit_proposal(report, output, runner_temp):\n    temp = Path(runner_temp).absolute()\n    target = Path(output).absolute()\n    for path in (temp, *temp.parents, target, *target.parents):\n        require(not path.is_symlink(), 'Artifact path contains a link')\n    temp, target = temp.resolve(), target.resolve()\n    require(temp.is_dir() and target == temp / 'postmerge-proposal' / 'proposal.json',\n            'Artifact output is not the fixed runner-temp path')\n    raw = (json.dumps(report, ensure_ascii=True, indent=2, allow_nan=False) + '\\n').encode('utf-8')\n    require(len(raw) <= 65536, 'Proposal metadata exceeds artifact limit')\n    target.parent.mkdir(mode=0o700, exist_ok=False)\n    owned_identity = None\n    try:\n        with target.open('xb') as handle:\n            owned = os.fstat(handle.fileno())\n            owned_identity = (owned.st_dev, owned.st_ino)\n            handle.write(raw)\n    except OSError:\n        # Never remove a competing path after failed exclusive creation.\n        if owned_identity is not None:\n            try:\n                current = target.stat(follow_symlinks=False)\n                if (current.st_dev, current.st_ino) == owned_identity:\n                    target.unlink()\n            except OSError:\n                pass\n        raise\n\n\ndef main():\n    try:\n        require(os.environ.get('GITHUB_EVENT_NAME') == 'workflow_run', 'Unexpected workflow event')\n        expected = repository(os.environ.get('EXPECTED_REPOSITORY'))\n        workflow_sha = sha(os.environ.get('EXPECTED_WORKFLOW_SHA'))\n        native_sha = os.environ.get('GITHUB_WORKFLOW_SHA')\n        require(not native_sha or sha(native_sha) == workflow_sha, 'Workflow code identity mismatch')\n        workflow_ref = os.environ.get('GITHUB_WORKFLOW_REF', '')\n        ref_parts = workflow_ref.split('/', 2)\n        require(len(ref_parts) == 3\n                and repository('/'.join(ref_parts[:2])) == expected\n                and ref_parts[2] == PROPOSAL_PATH + '@refs/heads/main',\n                'Workflow is not the installed default-branch definition')\n        api = GitHubAPI(os.environ.get('GH_TOKEN'))\n        with Path(os.environ['GITHUB_EVENT_PATH']).open('rb') as handle:\n            raw = handle.read(MAX_EVENT_BYTES + 1)\n        event = parse_json(raw)\n        report = build_proposal(event, expected, workflow_sha, api.get_json)\n        report['workflow_definition']['ref'] = workflow_ref\n        report['raw_event_sha256'] = hashlib.sha256(raw).hexdigest()\n        emit_proposal(report, os.environ['PROPOSAL_OUTPUT'], os.environ['RUNNER_TEMP'])\n    except Exception:\n        # The process boundary fails closed and redacts unexpected errors too.\n        print('ERROR: postmerge metadata verification failed; no proposal was published.', file=sys.stderr)\n        return 1\n    print('Wrote metadata-only PROPOSED artifact; human editorial approval remains UNVERIFIED.')\n    return 0\n\n\nif __name__ == '__main__':\n    raise SystemExit(main())\nPY\n"
        },
        {
          "name": "Upload review-only metadata proposal",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "postmerge-metadata-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}",
            "path": "${{ runner.temp }}/postmerge-proposal/proposal.json",
            "if-no-files-found": "error",
            "retention-days": 7,
            "overwrite": false,
            "include-hidden-files": false
          }
        }
      ]
    }
  }
}
