name: Novel continuity checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/story-engine-v0.2-github-only, feat/e1-story-roots, feat/e2-schema-state, feat/e3-e4-agent-contracts, feat/e5-provenance-rollup, feat/e6-e7-acceptance]
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned schema validation dependencies from PyPI
        run: >-
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements.txt
      - name: Validate base story registry and causal order
        run: python scripts/novelctl.py check
      - name: Validate approved-only Story Engine ledger
        run: python scripts/story_engine.py check
      - name: Build first scene context (smoke test)
        run: python scripts/story_engine.py pack SC-001 --recent 7 --out /tmp/SC-001-context.md
      - name: Regression tests
        run: python -m unittest discover -s tests -v
