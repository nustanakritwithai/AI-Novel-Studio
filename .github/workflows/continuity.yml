name: Novel continuity checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate story registry and causal order
        run: python scripts/novelctl.py check
      - name: Regression tests
        run: python -m unittest discover -s tests -v
